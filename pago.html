<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra | Cupido Riviera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js"></script>
</head>
<body>
    <div class="bg-animation"></div>

    <main class="glass-container">
        <header>
            <div class="logo-area">💳 Checkout</div>
            <p>Completando pedido de: <strong id="usuario-nombre">...</strong></p>
        </header>

        <div class="form-glass aesthetic-form">
            <div id="resumen-compra" class="resumen-pedido">
                Cargando producto...
            </div>

            <form id="cupido-form">
                
                <h3 class="label-titulo" style="margin-top: 20px;">1. Personaliza tu Ramo</h3>
                
                <div class="color-selector">
                    <label class="color-option"><input type="radio" name="color_rosas" value="Rojo" checked><span class="bubble" style="background:#d63031;"></span></label>
                    <label class="color-option"><input type="radio" name="color_rosas" value="Amarillo"><span class="bubble" style="background:#f1c40f;"></span></label>
                    <label class="color-option"><input type="radio" name="color_rosas" value="Rosa"><span class="bubble" style="background:#fd79a8;"></span></label>
                    <label class="color-option"><input type="radio" name="color_rosas" value="Azul"><span class="bubble" style="background:#0984e3;"></span></label>
                </div>

                <div class="input-group center-content">
                    <div class="toggle-container">
                        <span class="toggle-label">Alumn@</span>
                        <label class="switch">
                            <input type="checkbox" id="tipo-destinatario" onchange="cambiarFormulario()">
                            <span class="slider round"></span>
                        </label>
                        <span class="toggle-label">Profe</span>
                    </div>
                </div>

                <div class="input-wrapper"><span class="icon">👤</span><input type="text" id="destinatario" required placeholder="Nombre Destinatario"></div>
                
                <div id="campos-alumno">
                    <div class="row">
                        <div class="input-wrapper"><select id="grado"><option value="1ro">1ro</option><option value="2do">2do</option><option value="3ro">3ro</option></select></div>
                        <div class="input-wrapper"><input type="text" id="grupo" placeholder="Grupo"></div>
                    </div>
                </div>
                
                <div id="campos-profesor" class="hidden">
                    <div class="input-wrapper"><input type="text" id="area-profe" placeholder="Materia / Área"></div>
                </div>

                <div class="input-wrapper textarea-wrapper"><span class="icon">💌</span><textarea id="mensaje" rows="2" placeholder="Nota..."></textarea></div>

                <div class="separator-dots"></div>
                
                <div style="text-align: center; margin-bottom: 20px; background: rgba(255,255,255,0.5); padding: 10px; border-radius: 10px;">
                    <p style="font-size: 0.9rem; font-weight: bold; color: #555;">🔒 Pago 100% Seguro</p>
                    <p style="font-size: 0.8rem;">Procesado por Shopify (Tarjeta, Apple Pay, Google Pay)</p>
                </div>

                <button type="submit" class="btn-enviar" id="btn-pagar">Ir a Pagar Ahora 💳</button>
            </form>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
